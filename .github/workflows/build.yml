name: Build

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup native build Python
        if: runner.os == 'macOS' || runner.os == 'Windows'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Stage pinned Apple Silicon native runtime
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          python3 -m venv "$RUNNER_TEMP/parakeet-tools"
          "$RUNNER_TEMP/parakeet-tools/bin/pip" install cmake==4.2.3
          python3 native/parakeet/build.py --cmake "$RUNNER_TEMP/parakeet-tools/bin/cmake"

      - name: Stage pinned Windows x64 native runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python native/parakeet/build.py

      - name: Restore
        run: dotnet restore WhisperDrop.sln --property:Configuration=Release

      - name: Build
        run: dotnet build WhisperDrop.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test WhisperDrop.sln --configuration Release --no-build --verbosity minimal

      - name: Publish self-contained Windows x64 package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'parakeetdrop-win-x64'
          dotnet publish src/WhisperDrop/WhisperDrop.csproj --configuration Release --runtime win-x64 --self-contained true --output $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($relative in @('ParakeetDrop.exe', 'parakeet/win-x64/transcribe.dll', 'parakeet/win-x64/ggml-base.dll', 'parakeet/win-x64/ggml-cpu.dll')) {
            if (-not (Test-Path (Join-Path $output $relative))) {
              throw "Windows publish output is missing $relative"
            }
          }

      - name: Validate Homebrew Cask syntax
        if: runner.os == 'Linux'
        run: ruby -c Casks/parakeetdrop.rb
