name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  attestations: write
  id-token: write

env:
  DOTNET_NOLOGO: true

jobs:
  package:
    name: Verify and package macOS ARM64
    runs-on: macos-15

    steps:
      - name: Validate release tag and ARM64 environment
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup native build Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Stage pinned Parakeet CPU and Metal runtime
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/parakeet-tools"
          "$RUNNER_TEMP/parakeet-tools/bin/pip" install cmake==4.2.3
          python3 native/parakeet/build.py --cmake "$RUNNER_TEMP/parakeet-tools/bin/cmake"

      - name: Restore
        run: dotnet restore WhisperDrop.sln --property:Configuration=Release

      - name: Build
        run: dotnet build WhisperDrop.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test WhisperDrop.sln --configuration Release --no-build --verbosity minimal

      - name: Publish and verify final archive
        shell: bash
        run: python3 scripts/package_macos.py --tag "$GITHUB_REF_NAME" --output "$RUNNER_TEMP/release-assets"

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: package-osx-arm64
          path: |
            ${{ runner.temp }}/release-assets/ParakeetDrop-${{ github.ref_name }}-osx-arm64-app.zip
            ${{ runner.temp }}/release-assets/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attest package
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/release-assets/ParakeetDrop-${{ github.ref_name }}-osx-arm64-app.zip

  release:
    name: Create or update GitHub Release
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          name: package-osx-arm64
          path: ${{ runner.temp }}/downloaded

      - name: Verify assets and create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $downloadDir = Join-Path $env:RUNNER_TEMP "downloaded"
          $assetsDir = Join-Path $env:RUNNER_TEMP "release-assets"
          New-Item -ItemType Directory -Force -Path $assetsDir | Out-Null

          $arm = "ParakeetDrop-$env:GITHUB_REF_NAME-osx-arm64-app.zip"
          $expected = @($arm, "SHA256SUMS.txt")
          $downloaded = @(Get-ChildItem $downloadDir -File -Recurse)
          if ($downloaded.Count -ne 2 -or @($downloaded | Where-Object Name -NotIn $expected).Count -ne 0) {
            throw "Release must contain exactly the ARM64 ZIP and SHA256SUMS.txt."
          }
          $archive = Join-Path $downloadDir $arm
          $checksums = Join-Path $downloadDir "SHA256SUMS.txt"
          $line = (Get-Content -Raw $checksums).Trim()
          if ($line -notmatch '^(?<hash>[0-9a-f]{64})  (?<file>.+)$' -or $Matches['file'] -ne $arm) {
            throw "Invalid release checksum manifest."
          }
          $expectedHash = $Matches['hash']
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedHash) {
            throw "Release archive SHA-256 mismatch."
          }
          Copy-Item $archive, $checksums $assetsDir

          $tagPattern = '^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$'
          $previous = git tag --merged $env:GITHUB_REF_NAME --list "v*.*.*" |
            ForEach-Object {
              if ($_ -match $tagPattern -and $_ -ne $env:GITHUB_REF_NAME) {
                [pscustomobject]@{
                  Tag = $_
                  Major = [int]$Matches["major"]
                  Minor = [int]$Matches["minor"]
                  Patch = [int]$Matches["patch"]
                }
              }
            } |
            Sort-Object Major, Minor, Patch |
            Select-Object -Last 1

          if ($previous) {
            $changesHeading = "### Changes since $($previous.Tag)"
            $changes = @(git log "$($previous.Tag)..$env:GITHUB_REF_NAME" --no-merges --pretty=format:"- %s (%h)")
          }
          else {
            $changesHeading = "### Changes"
            $changes = @(git log $env:GITHUB_REF_NAME --no-merges --pretty=format:"- %s (%h)")
          }
          if ($changes.Count -eq 0) {
            $changes = @("- No commit summary available.")
          }

          $baseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME"
          $notes = @(
            "## ParakeetDrop $env:GITHUB_REF_NAME",
            "",
            "### Download",
            "",
            "- macOS Apple Silicon: [$arm]($baseUrl/$arm)",
            "- SHA-256: [SHA256SUMS.txt]($baseUrl/SHA256SUMS.txt)",
            "",
            $changesHeading,
            ""
          )
          $notes += $changes
          $notes += @(
            "",
            "### Notes",
            "",
            "- Packages are self-contained and do not require a separately installed .NET Runtime.",
            "- Parakeet Ultra Q8_0 is an explicit application-managed download; model weights are not included.",
            "- Windows is planned for a later stage and is not verified or release-ready. Intel macOS and Rosetta are unsupported.",
            "- Parakeet CPU/Metal and FFmpeg shared runtimes, licenses, and native checksums are bundled app-locally.",
            "- macOS builds are currently unsigned and not notarized. On first launch, use Finder -> Open if Gatekeeper blocks the application.",
            "- Homebrew install: brew tap dimonsmart/whisperdrop https://github.com/DimonSmart/WhisperDrop ; brew install --cask dimonsmart/whisperdrop/parakeetdrop"
          )

          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          $notes | Set-Content $notesPath -Encoding utf8

          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --title "ParakeetDrop $env:GITHUB_REF_NAME" --notes-file $notesPath
          }
          else {
            gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --verify-tag --title "ParakeetDrop $env:GITHUB_REF_NAME" --notes-file $notesPath
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create or update GitHub Release."
          }

          $publishedNames = @(gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect existing release assets." }
          foreach ($name in $publishedNames) {
            if ($name -notin $expected) {
              gh release delete-asset $env:GITHUB_REF_NAME $name --repo $env:GITHUB_REPOSITORY --yes
              if ($LASTEXITCODE -ne 0) { throw "Could not remove stale release artifact '$name'." }
            }
          }
          Get-ChildItem $assetsDir -File | ForEach-Object {
            gh release upload $env:GITHUB_REF_NAME $_.FullName --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload '$($_.Name)'."
            }
          }
